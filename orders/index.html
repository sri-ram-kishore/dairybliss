<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f4">
  <meta name="description" content="Order fresh paneer from Dairy Bliss — select your apartment to get started.">
  <title>Dairy Bliss — Order Fresh Paneer</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/favicon.png">

  <style>
    :root {
      --green:       #3d7a1a;
      --green-mid:   #4e9522;
      --green-light: #e6f3de;
      --cream:       #faf8f4;
      --white:       #ffffff;
      --text:        #1c2f5c;
      --text-mid:    #4a5f7a;
      --text-soft:   #7a8fa8;
      --border:      rgba(28,47,92,0.10);
      --shadow:      0 1px 3px rgba(0,0,0,0.07), 0 2px 10px rgba(0,0,0,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── HEADER ── */
    .hd {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(22px);
      -webkit-backdrop-filter: saturate(180%) blur(22px);
      text-align: left;
      padding: max(14px, calc(env(safe-area-inset-top) + 10px)) 14px 10px;
      padding-left: max(14px, calc((100% - 520px) / 2 + 14px));
    }
    .logo-wrap {
      width: min(45vw, 175px); height: auto;
      aspect-ratio: 1300 / 580;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .hd-sep { margin: 0; border: none; border-top: 1px solid var(--border); }

    /* ── PAGE ── */
    .page { max-width: 520px; margin: 0 auto; padding: 0 14px 60px; }

    .page-title {
      font-size: 26px; font-weight: 760; color: var(--text);
      letter-spacing: -0.5px; line-height: 1.1;
      padding: 28px 0 6px;
    }
    .page-sub {
      font-size: 15px; color: var(--text-mid);
      padding: 0 0 24px; line-height: 1.5;
    }

    /* ── APARTMENT CARDS ── */
    .apt-cards { display: flex; flex-direction: column; gap: 12px; }

    .apt-card {
      display: flex; align-items: center;
      gap: 18px;
      padding: 20px 20px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .apt-card:hover {
      border-color: var(--green-mid);
      box-shadow: 0 4px 18px rgba(61,122,26,0.12);
    }
    .apt-card:active { transform: scale(0.988); }

    .apt-icon {
      width: 52px; height: 52px; border-radius: 13px;
      background: var(--green-light);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 26px;
    }

    .apt-body { flex: 1; }
    .apt-name {
      font-size: 17px; font-weight: 500; color: var(--text);
      letter-spacing: -0.3px; margin-bottom: 3px;
    }
    .apt-short {
      display: inline-block;
      font-size: 11px; font-weight: 700;
      color: var(--green); background: var(--green-light);
      padding: 2px 8px; border-radius: 10px;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .apt-desc {
      font-size: 13px; color: var(--text-soft);
    }

    .apt-arrow {
      color: var(--text-soft); flex-shrink: 0;
    }

    /* ── FOOTER ── */
    .foot {
      text-align: center; font-size: 13px; color: var(--text-soft);
      font-style: italic; padding-top: 28px;
    }
  </style>
</head>
<body>

<header class="hd">
  <div class="logo-wrap">
    <img src="../assets/logo.png" alt="DairyBliss"
         onerror="this.style.display='none'">
  </div>
</header>
<hr class="hd-sep">

<div class="page">
  <p class="page-title">Order fresh paneer</p>
  <p class="page-sub">Select your apartment to place an order.</p>

  <div class="apt-cards">
    <a class="apt-card" href="spc/">
      <div class="apt-icon">🏢</div>
      <div class="apt-body">
        <div class="apt-short">SPC</div>
        <div class="apt-name">Sobha Palm Court</div>
        <div class="apt-desc">Wed &amp; Sat delivery</div>
      </div>
      <svg class="apt-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <a class="apt-card" href="bnr/">
      <div class="apt-icon">🏢</div>
      <div class="apt-body">
        <div class="apt-short">BNR</div>
        <div class="apt-name">Brigade North Ridge</div>
        <div class="apt-desc">Wed &amp; Sat delivery</div>
      </div>
      <svg class="apt-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>
  </div>

  <p class="foot">Pure paneer. Delivered twice a week.</p>
</div>

</body>
</html>
